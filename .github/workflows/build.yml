name: Profile card

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate.py, avatar.png, .github/workflows/build.yml]

permissions:
  contents: write

concurrency:
  group: profile-card

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pillow numpy
      - name: Render card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::PROFILE_TOKEN secret is missing"; exit 1; }
          python generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || { git commit -m "Update profile card"; git push; }
